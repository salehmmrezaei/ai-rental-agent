<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
  <title id="title">Casa architecture and development flow</title>
  <desc id="description">Tenants, landlords and agency staff use a React interface connected to FastAPI. The API manages PostgreSQL data and persistent photo storage. Optional AI uses the OpenAI Agents SDK and Responses API through the backend, and AI changes require explicit user confirmation. Development progresses through database, authentication, listings, rentals, interface, demo and AI, with pytest, Vitest, Playwright and Docker for verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#6c8270" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #173e32; }
      .muted { fill: #657564; }
      .eyebrow { font-size: 16px; font-weight: 650; letter-spacing: 2px; }
      .heading { font-size: 26px; font-weight: 650; }
      .body { font-size: 19px; }
      .line { fill: none; stroke: #6c8270; stroke-width: 2; marker-end: url(#arrow); }
      .card { fill: #fffefb; stroke: #dbe0d4; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="980" rx="28" fill="#f8f7f0"/>
  <rect x="24" y="24" width="1152" height="932" rx="22" fill="none" stroke="#e1e5d9"/>

  <text x="54" y="84" font-size="44" font-weight="750" letter-spacing="-2">casa.</text>
  <text x="1146" y="77" text-anchor="end" class="eyebrow muted">AI RENTAL AGENT</text>
  <text x="54" y="138" font-size="35" font-weight="600" letter-spacing="-.6">Architecture &amp; development</text>
  <text x="54" y="176" font-size="21" class="muted">One platform for finding homes and managing the rental journey.</text>

  <text x="54" y="221" class="eyebrow muted">01 / HOW IT WORKS</text>

  <!-- The browser communicates with the API; the backend owns data access. -->
  <rect x="54" y="248" width="300" height="154" rx="18" class="card"/>
  <rect x="72" y="266" width="40" height="40" rx="11" fill="#e9eedf"/>
  <g transform="translate(82 276)" fill="none" stroke="#173e32" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="20" height="15" rx="2"/>
    <path d="M6 20h8M10 15v5M0 5h20"/>
  </g>
  <text x="126" y="295" class="heading">React interface</text>
  <text x="76" y="339" class="body muted">TypeScript · Tailwind · Vite</text>
  <text x="76" y="373" class="body muted">Tenants · landlords · agency</text>

  <path d="M354 325 H444" class="line"/>
  <text x="399" y="306" text-anchor="middle" font-size="15" class="muted">REST / JWT</text>

  <rect x="450" y="248" width="300" height="154" rx="18" fill="#173e32"/>
  <rect x="468" y="266" width="40" height="40" rx="11" fill="#325647"/>
  <g transform="translate(478 275)" fill="none" stroke="#f8f7f0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 1-6 9 6 9M14 1l6 9-6 9M12 0 8 20"/>
  </g>
  <text x="522" y="295" class="heading" style="fill:#f8f7f0">FastAPI backend</text>
  <text x="472" y="339" class="body" style="fill:#d9e3d7">Permissions · rental services</text>
  <text x="472" y="373" class="body" style="fill:#d9e3d7">Availability · transactions</text>

  <path d="M750 325 H840" class="line"/>
  <text x="795" y="306" text-anchor="middle" font-size="15" class="muted">SQLAlchemy</text>

  <rect x="846" y="248" width="300" height="154" rx="18" class="card"/>
  <rect x="864" y="266" width="40" height="40" rx="11" fill="#e9eedf"/>
  <g transform="translate(874 275)" fill="none" stroke="#173e32" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="10" cy="4" rx="9" ry="4"/>
    <path d="M1 4v14c0 5 18 5 18 0V4M1 11c0 5 18 5 18 0"/>
  </g>
  <text x="918" y="295" class="heading">PostgreSQL</text>
  <text x="868" y="339" class="body muted">Listings · contracts · chats</text>
  <text x="868" y="373" class="body muted">Alembic migrations</text>

  <!-- AI is optional and only called server-side. -->
  <path d="M600 402 V480" class="line" stroke-dasharray="6 7"/>
  <text x="620" y="449" font-size="17" class="muted">backend only</text>
  <rect x="450" y="488" width="300" height="154" rx="18" fill="#edf1e5" stroke="#9cac91" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="472" y="527" class="eyebrow muted">OPTIONAL AI</text>
  <text x="472" y="566" class="heading">OpenAI</text>
  <text x="472" y="599" class="body muted">Agents SDK · Responses API</text>
  <text x="472" y="625" class="body muted">Role-specific tools · live data</text>

  <!-- Photo bytes live in a persistent volume and are served by FastAPI. -->
  <path d="M750 371 H795 Q810 371 810 386 V550 Q810 565 825 565 H840" class="line"/>
  <rect x="846" y="488" width="300" height="154" rx="18" class="card"/>
  <text x="868" y="527" class="eyebrow muted">MEDIA</text>
  <text x="868" y="566" class="heading">Photo storage</text>
  <text x="868" y="599" class="body muted">Persistent Docker volume</text>
  <text x="868" y="625" class="body muted">Access checked by the API</text>

  <!-- This callout explains the AI action boundary, rather than a new service. -->
  <rect x="54" y="488" width="300" height="154" rx="18" fill="#e7ecdd"/>
  <text x="76" y="527" class="eyebrow muted">YOU STAY IN CONTROL</text>
  <text x="76" y="566" font-size="24" font-weight="650">Review, then confirm</text>
  <text x="76" y="599" class="body muted">AI proposes. You approve.</text>
  <text x="76" y="625" class="body muted">Access is checked again.</text>

  <path d="M54 686 H1146" stroke="#dbe0d4" stroke-width="1.5"/>
  <text x="54" y="729" class="eyebrow muted">02 / DEVELOPMENT FLOW</text>

  <g>
    <rect x="54" y="754" width="144" height="96" rx="14" class="card"/>
    <text x="72" y="784" font-size="17" class="muted">01</text>
    <text x="72" y="824" font-size="21" font-weight="600">Database</text>
    <path d="M201 802 H207" class="line"/>

    <rect x="212" y="754" width="144" height="96" rx="14" class="card"/>
    <text x="230" y="784" font-size="17" class="muted">02</text>
    <text x="230" y="824" font-size="21" font-weight="600">Auth</text>
    <path d="M359 802 H365" class="line"/>

    <rect x="370" y="754" width="144" height="96" rx="14" class="card"/>
    <text x="388" y="784" font-size="17" class="muted">03</text>
    <text x="388" y="824" font-size="21" font-weight="600">Listings</text>
    <path d="M517 802 H523" class="line"/>

    <rect x="528" y="754" width="144" height="96" rx="14" class="card"/>
    <text x="546" y="784" font-size="17" class="muted">04</text>
    <text x="546" y="824" font-size="21" font-weight="600">Rentals</text>
    <path d="M675 802 H681" class="line"/>

    <rect x="686" y="754" width="144" height="96" rx="14" class="card"/>
    <text x="704" y="784" font-size="17" class="muted">05</text>
    <text x="704" y="824" font-size="21" font-weight="600">Interface</text>
    <path d="M833 802 H839" class="line"/>

    <rect x="844" y="754" width="144" height="96" rx="14" class="card"/>
    <text x="862" y="784" font-size="17" class="muted">06</text>
    <text x="862" y="824" font-size="21" font-weight="600">Demo</text>
    <path d="M991 802 H997" class="line"/>

    <rect x="1002" y="754" width="144" height="96" rx="14" fill="#173e32"/>
    <text x="1020" y="784" font-size="17" style="fill:#c7d5bf">07</text>
    <text x="1020" y="824" font-size="21" font-weight="600" style="fill:#f8f7f0">AI</text>
  </g>

  <text x="54" y="914" class="eyebrow muted">VERIFIED WITH</text>
  <text x="260" y="914" font-size="21" font-weight="550">pytest</text>
  <circle cx="349" cy="907" r="3" fill="#9cac91"/>
  <text x="377" y="914" font-size="21" font-weight="550">Vitest</text>
  <circle cx="462" cy="907" r="3" fill="#9cac91"/>
  <text x="490" y="914" font-size="21" font-weight="550">Playwright</text>
  <circle cx="624" cy="907" r="3" fill="#9cac91"/>
  <text x="652" y="914" font-size="21" font-weight="550">Docker</text>
</svg>
