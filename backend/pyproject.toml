[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rental-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi==0.143.0", "uvicorn[standard]==0.54.0", "SQLAlchemy==2.0.54",
 "Pillow==12.3.0", "python-multipart==0.0.32",
 "argon2-cffi==25.1.0", "PyJWT==2.15.1", "email-validator==2.3.0",
 "alembic==1.20.0", "psycopg[binary]==3.3.6", "pydantic-settings==2.15.0",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
seed = ["Faker>=40,<41"]
live = ["openai-agents>=0.23.1,<0.24"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["demo_assets/*.webp"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
