# Separate from docker-compose.yml: only Caddy publishes host ports.
name: casa

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?Set APP_DB_USER}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  JWT_ISSUER: casa-public-demo
  JWT_AUDIENCE: casa-public-demo-api
  CORS_ORIGINS: '["https://${CASA_DOMAIN:?Set CASA_DOMAIN}"]'
  PUBLIC_DEMO_MODE: "true"
  PUBLIC_DOCS_ENABLED: "false"
  DEMO_SESSION_MINUTES: ${DEMO_SESSION_MINUTES:-30}
  DEMO_MAX_SESSIONS: ${DEMO_MAX_SESSIONS:-1000}
  DEMO_ACCESS_RATE_LIMIT: ${DEMO_ACCESS_RATE_LIMIT:-20}
  DEMO_REQUEST_RATE_LIMIT: ${DEMO_REQUEST_RATE_LIMIT:-240}
  DEMO_GLOBAL_RATE_LIMIT: ${DEMO_GLOBAL_RATE_LIMIT:-1200}
  UPLOAD_DIR: /app/uploads
  # Deliberately do not import the development .env or a host OpenAI key.
  OPENAI_API_KEY: ""
  ASSISTANT_ENABLED: "false"
  ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-10}
  AUTH_RATE_LIMIT: 20
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-app: &app
  image: casa-backend:${CASA_VERSION:-local}
  build: ./backend
  environment: *app-environment
  networks: [private]
  read_only: true
  tmpfs:
    - /tmp:size=32m,noexec,nosuid
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging: *logging

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker beneath this mount.
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging: *logging

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 384m
    cpus: 0.75
    depends_on:
      db:
        condition: service_healthy

  # Explicitly opting into this production file opts into synthetic seeding.
  # Seed reruns preserve all existing records, passwords and date anchors.
  seed:
    <<: *app
    environment:
      <<: *app-environment
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a private random DEMO_PASSWORD}
    command: ["python", "-m", "app.seed", "--demo", "--non-interactive"]
    restart: "no"
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    <<: *app
    # In-memory visitor sessions/chat require one process and one replica.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*", "--limit-concurrency", "64", "--timeout-keep-alive", "5", "--no-access-log"]
    volumes:
      - image_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 640m
    cpus: 1.0
    stop_grace_period: 30s
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    image: casa-web:${CASA_VERSION:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    environment:
      CASA_DOMAIN: ${CASA_DOMAIN:?Set CASA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, edge]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  image_data:
  caddy_data:
  caddy_config:

networks:
  # App/database have no direct internet route; only the proxy can reach ACME.
  private:
    internal: true
  edge:
